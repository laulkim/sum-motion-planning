planar_velocity_sim_node:
  ros__parameters:
    # The plant is integrated faster than or equal to this internal step.  The
    # localization output is intentionally slower than the 100 Hz plant.
    update_rate_hz: 100.0
    estimator_rate_hz: 50.0
    max_internal_step_sec: 0.005

    # Command transport and watchdog.  A timed-out command becomes a zero
    # target and the dynamics model performs a limited stop.
    command.delay_sec: 0.06
    command.timeout_sec: 0.25

    # Closed low-level body-velocity loop.  This preserves the planner's
    # vx/vy/yaw-rate interface and all four forward/reverse/crab modes.
    dynamics.enabled: true
    dynamics.vx_time_constant_sec: 0.22
    dynamics.vy_time_constant_sec: 0.30
    dynamics.yaw_rate_time_constant_sec: 0.20
    dynamics.vx_command_gain: 0.995
    dynamics.vy_command_gain: 0.990
    dynamics.yaw_rate_command_gain: 0.995
    dynamics.max_vx_mps: 6.0
    dynamics.max_vy_mps: 6.0
    dynamics.max_yaw_rate_radps: 0.90
    dynamics.max_vx_acceleration_mps2: 1.5
    dynamics.max_vy_acceleration_mps2: 1.2
    dynamics.max_yaw_acceleration_radps2: 1.5
    dynamics.max_vx_jerk_mps3: 4.0
    dynamics.max_vy_jerk_mps3: 3.0
    dynamics.max_yaw_jerk_radps3: 5.0
    dynamics.rolling_resistance_acceleration_mps2: 0.03
    dynamics.command_deadband_mps: 0.002
    dynamics.yaw_rate_deadband_radps: 0.001
    dynamics.stop_speed_threshold_mps: 0.001

    # Residual error of an already-fused localization estimate.  Biases are
    # bounded, time-correlated Gauss-Markov processes rather than per-sample
    # independent jumps.  Set the seed to reproduce a run exactly.
    estimator.enabled: true
    estimator.delay_sec: 0.04
    estimator.dropout_probability: 0.0
    estimator.position_noise_std_m: 0.015
    estimator.yaw_noise_std_rad: 0.0035
    # Keep standstill velocity uncertainty well below the 0.03 m/s drive-mode
    # transition threshold used by the planner and scenario manager.
    estimator.velocity_noise_std_mps: 0.005
    estimator.yaw_rate_noise_std_radps: 0.003
    estimator.position_bias_std_m: 0.025
    estimator.yaw_bias_std_rad: 0.005
    estimator.velocity_bias_std_mps: 0.003
    estimator.yaw_rate_bias_std_radps: 0.002
    estimator.bias_correlation_time_sec: 30.0
    estimator.position_resolution_m: 0.001
    estimator.yaw_resolution_rad: 0.0001
    estimator.velocity_resolution_mps: 0.001
    estimator.yaw_rate_resolution_radps: 0.0001
    estimator.random_seed: 42
